[package]
name = "polymesh-api-example-leptos"
version = "0.1.0"
edition = "2021"

[patch.crates-io]
# Use these for testing new versions of `polymesh-api`.
#polymesh-api = { git = "https://github.com/PolymeshAssociation/polymesh-api" }
#polymesh-api-client = { git = "https://github.com/PolymeshAssociation/polymesh-api" }
#polymesh-api-client-extras = { git = "https://github.com/PolymeshAssociation/polymesh-api" }
#polymesh-api-tester = { git = "https://github.com/PolymeshAssociation/polymesh-api" }
#polymesh-api-codegen = { git = "https://github.com/PolymeshAssociation/polymesh-api" }
#polymesh-api-codegen-macro = { git = "https://github.com/PolymeshAssociation/polymesh-api" }

# DART
# Curve tree dependencies
#curve_tree_bulletproofs = { package = "bulletproofs", path = "../curve-trees/bulletproofs" }
#curve_tree_relations = { package = "relations", path = "../curve-trees/relations" }
# If want to pull code for curve-trees from git, comment above 2 relations and uncomment below 2
curve_tree_bulletproofs = { package = "bulletproofs", git = "https://github.com/PolymeshAssociation/curve-trees", branch = "polymesh" }
curve_tree_relations = { package = "relations", git = "https://github.com/PolymeshAssociation/curve-trees", branch = "polymesh" }

#dock_crypto_utils = { path = "../crypto/utils" }
#schnorr_pok = { path = "../crypto/schnorr_pok" }
dock_crypto_utils = { git = "https://github.com/PolymeshAssociation/crypto" }
schnorr_pok = { git = "https://github.com/PolymeshAssociation/crypto" }

#polymesh-dart = { path = "../polymesh-dart" }
#polymesh-dart-bp = { path = "../polymesh-dart/dart-bp" }
#polymesh-dart-common = { path = "../polymesh-dart/dart-common" }
polymesh-dart = { git = "https://github.com/PolymeshAssociation/polymesh-dart", branch = "main" }
polymesh-dart-bp = { git = "https://github.com/PolymeshAssociation/polymesh-dart", branch = "main" }
polymesh-dart-common = { git = "https://github.com/PolymeshAssociation/polymesh-dart", branch = "main" }

# Polymesh changes to Arkworks.
#ark-serialize = { path = "../../arkworks-algebra/serialize" }
#ark-ec = { path = "../../arkworks-algebra/ec" }
#ark-ff = { path = "../../arkworks-algebra/ff" }
#ark-pallas = { path = "../../arkworks-algebra/curves/pallas" }
#ark-vesta = { path = "../../arkworks-algebra/curves/vesta" }
ark-serialize = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-ec = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-ff = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-pallas = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }
ark-vesta = { git = "https://github.com/PolymeshAssociation/arkworks-algebra.git", branch = "polymesh-master" }

[dependencies]
console_error_panic_hook = "0.1"

leptos = { version = "0.8.2", features = ["nightly", "csr"] }
leptos_meta = { version = "0.8.2" }
leptos_router = { version = "0.8.2", features = ["nightly"] }

wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.4"

leptos-use = "0.16"
codee = "0.3"

serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0" }

hex = "0.4"
log = "0.4"
wasm-logger = "0.2"

rand = { version = "0.8", default-features = false, features = ["alloc", "getrandom"] }
getrandom = { version = "0.3", default-features = false, features = ["wasm_js"] }

web-sys = { version = "0.3", features = ["Window", "Performance", "console"] }

# native:
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
polymesh-api = { version = "3.6", features = [] }
# DART Assets
polymesh-dart = { version = "0.1.0", default-features = false, features = [
  "std",
  "asm",
  "parallel",
  "backend_bp",
  "async_tree",
] }

# web:
[target.'cfg(target_arch = "wasm32")'.dependencies]
polymesh-api = { version = "3.6", default-features = false, features = ["polymesh_v7", "wasm", "serde"] }
# DART Assets
polymesh-dart = { version = "0.1.0", default-features = false, features = [
	"no_std",
  "backend_bp",
  "async_tree",
] }

[features]
default = []

download_metadata = [
  "polymesh-api/download_metadata",
]

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "polymesh-api-example-leptos"
# The site root folder is where cargo-leptos generate all output. WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"
# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"
# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/app.css
style-file = "style/main.scss"
# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "assets"
# The IP and port (ex: 127.0.0.1:8000) where the server serves the content. Use it in your server setup.
site-addr = "127.0.0.1:8000"
# The port to use for automatic reload monitoring
reload-port = 3001
# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"
#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"
# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "DEV"
# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
